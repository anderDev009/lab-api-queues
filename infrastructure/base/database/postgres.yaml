apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: bd-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bd-deployment
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres 

    spec:
      containers:
        - name: postgres-bd
          image: postgres:15
          ports:
            - containerPort: 5432
          volumeMounts:
            - name:  bd-data-volume
              mountPath: /var/lib/postgresql/data
          env: 
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: reservations
            - name: POSTGRES_PASSWORD
              value: postgres
      volumes:
        - name: bd-data-volume
          persistentVolumeClaim:
            claimName: bd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bd-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
  type: ClusterIP 