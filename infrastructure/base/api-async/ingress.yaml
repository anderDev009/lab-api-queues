apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-async-ingress
  namespace: 
spec:
  ingressClassName: traefik
  rules:
  - host: api-async.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-async-svc
            port:
              number: 8080
