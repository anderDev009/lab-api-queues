apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-sync
  labels:
    app: api-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-sync
  
  template:
    metadata:
      labels:
        app: api-sync
    
    spec:
      containers:
        - name: api-sync
          image: richarddev009/api_sync_async_membership:1.0
          ports:
            - containerPort: 8080
          args:
            - "--APP=api-sync"
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "reservations"
            - name: DB_HOST
              value: "bd-service"