apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-sync
  labels:
    app: api-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-sync
  
  template:
    metadata:
      labels:
        app: api-sync
    
    spec:
      containers:
        - name: api-sync
          image: richarddev009/api_sync_async_membership:api-sync-1.0
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "reservations"
            - name: DB_HOST
              value: "bd-service"
---
apiVersion: v1
kind: Service
metadata:
  name: api-sync-svc
  namespace: queue-lab
spec:
  selector:
    app: api-sync
  type: LoadBalancer
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8080 
