# https://kubernetes.io/docs/concepts/services-networking/ingress/#the-ingress-resource

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-sync-ingress
  namespace: queue-lab
spec:
  ingressClassName: traefik
  rules:
  - host: api-sync.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-sync-svc
            port:
              number: 8081